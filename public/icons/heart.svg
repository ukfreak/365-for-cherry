<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8DDE6" />
      <stop offset="50%" stop-color="#F3C6D5" />
      <stop offset="100%" stop-color="#C77D98" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C77D98" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#C77D98" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Soft Circle -->
  <circle cx="256" cy="256" r="236" fill="#FFF9F5" stroke="#F3C6D5" stroke-width="8"/>
  <circle cx="256" cy="256" r="220" fill="url(#roseGradient)" opacity="0.15"/>

  <!-- Romantic Heart with Shadow -->
  <path d="M256 420 C256 420 100 320 80 220 C60 120 170 80 256 165 C342 80 452 120 432 220 C412 320 256 420 256 420 Z"
        fill="url(#roseGradient)"
        filter="url(#softGlow)" />

  <!-- Heart Highlight Sparkle -->
  <path d="M256 390 C256 390 125 300 108 215 C92 135 180 100 248 175"
        stroke="url(#innerGlow)"
        stroke-width="12"
        stroke-linecap="round"
        fill="none" />

  <!-- Little Delicate Sparkle Stars -->
  <circle cx="160" cy="180" r="10" fill="#FFF" opacity="0.8"/>
  <circle cx="360" cy="190" r="6" fill="#FFF" opacity="0.8"/>
  <circle cx="256" cy="250" r="16" fill="#FFF9F5" opacity="0.9"/>
  <text x="256" y="258" font-family="'Playfair Display', serif" font-size="28" font-weight="bold" fill="#59434A" text-anchor="middle">365</text>
</svg>
